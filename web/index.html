<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ألسن - فقه الاستدراك</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/web/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/header-warm.css">
<link rel="stylesheet" href="/web/styles-warm.css">
</head>
<body>
<header class="site-header">
  <a href="/web/home.html" class="site-logo" aria-label="ألسن — الصفحة الرئيسية"><img src="/web/logo-gold.png" alt="ألسن"></a>
  <div class="site-title">فقه الاستدراك</div>
  <a href="/web/home.html" class="site-mark" aria-label="ألسن"><img src="/web/logo-mark.svg" alt=""></a>
</header>

<main class="app-main">
  <section class="panel panel-text">
    <div class="panel-body table-wrap">
      <table class="table align-middle text-table" dir="rtl">
        <thead>
          <tr>
            <th class="col-check">
              <input class="form-check-input" type="checkbox" id="check-all" title="تحديد الكل">
            </th>
            <th class="col-original">النص الأصلي</th>
            <th class="col-translated">الترجمة إلى الإنجليزية</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="block-rows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel panel-pdf">
    <div id="pdf-pages" class="panel-body"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
