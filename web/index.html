<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ألسن - فقه الاستدراك</title>
<link rel="icon" href="/web/logo-mark.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/web/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/header-warm.css">
<link rel="stylesheet" href="/web/styles-warm.css">
<link rel="stylesheet" href="/web/assistant.css">
<link rel="stylesheet" href="/web/loading-overlay.css">
</head>
<body>
<header class="site-header">
  <a href="/" class="site-logo" aria-label="ألسن — الصفحة الرئيسية"><img src="/web/logo-gold.png" alt="ألسن"></a>
  <select id="book-select" class="site-select" aria-label="اختر الكتاب">
    <option value="yaqzan.pdf">yaqzan.pdf</option>
    <option value="two-pages.pdf">two-pages.pdf</option>
  </select>
  <a href="/" class="site-mark" aria-label="ألسن"><img src="/web/logo-mark.svg" alt=""></a>
</header>

<main class="app-main">
  <section class="panel panel-text">
    <div class="toolbar toolbar-text">
      <button type="button" id="toggle-pdf" class="toggle-pdf" aria-pressed="true" title="إظهار / إخفاء عرض PDF">
        <i class="fa-solid fa-columns"></i>
      </button>
      <label class="tb-label" for="search-input">بحث:</label>
      <input type="text" id="search-input" class="search-input" placeholder="ابحث في النص..." autocomplete="off">
      <button type="button" id="translate-all" class="tb-button"
              title="ترجمة الصفوف غير المترجمة واحدًا تلو الآخر"><i class="fa-solid fa-language"></i> ترجمة الكل</button>
      <button type="button" id="open-assistant-rows" class="tb-button" disabled
              title="حدّد صفًا مترجمًا واحدًا على الأقل"><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي</button>
      <button type="button" id="merge-rows" class="tb-button" disabled
              title="حدّد صفين متجاورين على الأقل للدمج"><i class="fa-solid fa-object-group"></i> دمج الصفوف</button>
      <button type="button" id="open-glossary" class="tb-button"
              title="مصطلحاتك وترجماتها المعتمدة"><i class="fa-solid fa-book"></i> القاموس</button>
      <button type="button" id="open-settings" class="tb-button"
              title="مرجع القرآن ونموذج الذكاء الاصطناعي"><i class="fa-solid fa-gear"></i> الإعدادات</button>
      <button type="button" id="delete-rows" class="tb-icon tb-icon-danger" disabled
              aria-label="حذف الصفوف المحددة" title="حدّد صفًا أو أكثر للحذف"><i class="fa-solid fa-trash-can"></i></button>
      <button type="button" id="restart-work" class="tb-icon"
              aria-label="البدء من جديد" title="مسح العمل المحفوظ والبدء من جديد"><i class="fa-solid fa-rotate-left"></i></button>
    </div>
    <div class="panel-body table-wrap">
      <table class="table align-middle text-table" dir="rtl">
        <thead>
          <tr>
            <th class="col-check">
              <input class="form-check-input" type="checkbox" id="check-all" title="تحديد الكل">
            </th>
            <th class="col-original">النص الأصلي</th>
            <th class="col-translated" id="translated-heading">الترجمة</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="block-rows"></tbody>
      </table>
    </div>

    <div id="assistant-dock" class="assistant-dock" hidden>
      <div class="assistant-header">
        <strong><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي</strong>
        <div class="assistant-actions">
          <button type="button" id="assistant-expand" class="assistant-expand" aria-label="تكبير" title="تكبير"
                  aria-pressed="false"><i class="fa-solid fa-expand"></i></button>
          <button type="button" id="assistant-close" class="assistant-close" aria-label="إغلاق">&times;</button>
        </div>
      </div>
      <div id="assistant-context" class="assistant-context"></div>
      <div id="assistant-log" class="assistant-log"></div>
      <div class="assistant-input-row">
        <textarea id="assistant-instructions" rows="2" dir="auto" aria-label="تعليمة للمساعد الذكي"></textarea>
        <button type="button" id="assistant-send" class="btn btn-primary" aria-label="إرسال" title="إرسال (Ctrl+Enter)"><i class="fa-solid fa-check"></i></button>
      </div>
    </div>
  </section>

  <section class="panel panel-pdf">
    <div class="toolbar toolbar-pdf">
      <label class="page-indicator" for="page-input">
        الصفحة
        <input type="text" id="page-input" class="page-input" inputmode="numeric" value="1" aria-label="رقم الصفحة">
        <span id="page-total" class="page-total">/ —</span>
      </label>
    </div>
    <div id="pdf-pages" class="panel-body"></div>
  </section>
</main>

<div id="selection-tooltip" class="selection-tooltip" hidden>
  <button type="button"><i class="fa-solid fa-wand-magic-sparkles"></i> اسأل المساعد الذكي</button>
</div>
<div id="toast" class="toast-message" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
