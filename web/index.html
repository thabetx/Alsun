<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عارض داتا لاب</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/web/styles.css">
</head>
<body>
<nav class="header navbar navbar-dark bg-dark border-bottom border-secondary-subtle">
  <span class="navbar-brand h1 mb-0 fw-bold text-light header-title">فقه الاستدراك</span>
  <div class="header-spacer"></div>
  <img src="/web/logo.png" alt="شعار" class="header-logo">
  <div class="header-spacer"></div>
  <div class="header-avatar">
    <svg width="38" height="38" viewBox="0 0 64 64" aria-label="مستخدم">
      <circle cx="32" cy="32" r="30" fill="#adb5bd"/>
      <path d="M20 28 C18 38 19 44 23 51 L41 51 C45 44 46 38 44 28 Z" fill="#343a40"/>
      <circle cx="32" cy="20" r="10" fill="#f8f9fa"/>
    </svg>
  </div>
</nav>

<main class="app-main">
  <section class="panel panel-text">
    <div class="panel-body table-wrap">
      <table class="table align-middle text-table" dir="rtl">
        <thead>
          <tr>
            <th class="col-check">
              <input class="form-check-input" type="checkbox" id="check-all" title="تحديد الكل">
            </th>
            <th class="col-original">النص الأصلي</th>
            <th class="col-translated">الترجمة إلى الإنجليزية</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="block-rows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel panel-pdf">
    <div id="pdf-pages" class="panel-body"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
