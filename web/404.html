<body class="not-found-page">

<!-- served by python/main.py for every address that does not exist (a 404 answer) -->

<main class="not-found">
  <!-- the same art as the home page: the pen writes and many languages come out of it -->
      <div class="hero-visual" role="img"
         aria-label="قلم حبر يكتب خيوطاً ذهبية تتفرع إلى كلمات بلغات متعددة">
      <svg viewBox="0 -20 480 520" xmlns="http://www.w3.org/2000/svg" overflow="visible">
        <defs>
          <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1b1e22"/>
            <stop offset="0.32" stop-color="#4a5058"/>
            <stop offset="0.5" stop-color="#2a2e33"/>
            <stop offset="1" stop-color="#121417"/>
          </linearGradient>
          <linearGradient id="nibGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f3dc92"/>
            <stop offset="1" stop-color="#b8860b"/>
          </linearGradient>
          <radialGradient id="inkGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f3d27a" stop-opacity=".95"/>
            <stop offset="1" stop-color="#f3d27a" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- soft warm glow behind the nib -->
        <circle class="halo" cx="178" cy="236" r="130" fill="url(#inkGlow)"/>


        <!-- threads from the nib (178,225) to each word -->
        <g class="threads">
          <path class="thread" pathLength="1" style="--d:.30s" d="M178 225 C230 245 310 250 330 305"/>
          <path class="thread" pathLength="1" style="--d:.48s" d="M178 225 C130 222 85 232 60 265"/>
          <path class="thread" pathLength="1" style="--d:.66s" d="M178 225 C250 215 350 205 395 235"/>
          <path class="thread" pathLength="1" style="--d:.84s" d="M178 225 C140 250 110 300 88 355"/>
          <path class="thread" pathLength="1" style="--d:1.02s" d="M178 225 C200 300 255 360 260 430"/>
          <path class="thread" pathLength="1" style="--d:1.20s" d="M178 225 C165 300 160 380 150 445"/>
        </g>
        <g class="dots" fill="#fff" stroke="#b8860b" stroke-width="2.4">
          <circle class="dot" style="--d:1.20s" cx="330" cy="305" r="4"/>
          <circle class="dot" style="--d:1.38s" cx="60"  cy="265" r="4"/>
          <circle class="dot" style="--d:1.56s" cx="395" cy="235" r="4"/>
          <circle class="dot" style="--d:1.74s" cx="88"  cy="355" r="4"/>
          <circle class="dot" style="--d:1.92s" cx="260" cy="430" r="4"/>
          <circle class="dot" style="--d:2.10s" cx="150" cy="445" r="4"/>
        </g>

        <!-- sparkles -->
        <g class="sparkles" fill="#b8860b">
          <path class="spark" style="--d:0s"   d="M46 60 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
          <path class="spark" style="--d:1.1s" d="M436 150 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
          <path class="spark" style="--d:.6s"  d="M446 372 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
          <path class="spark" style="--d:1.7s" d="M30 470 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
        </g>

        <!-- glow at the nib tip -->
        <circle class="ink" cx="178" cy="225" r="14" fill="url(#inkGlow)"/>

        <!-- fountain pen: nib tip at the origin, body goes up (-y), tilted to the right -->
        <g transform="translate(178 225) rotate(38)">
          <g class="pen">
            <!-- barrel -->
            <path d="M-15 -90 H15 V-258 Q15 -270 0 -270 Q-15 -270 -15 -258Z" fill="url(#barrel)"/>
            <rect x="-9.5" y="-250" width="3.4" height="130" rx="1.7" fill="#fff" opacity=".2"/>
            <rect x="-15" y="-252" width="30" height="3" fill="#b8860b" opacity=".85"/>
            <!-- grip section + gold rings -->
            <path d="M-11 -44 H11 L14 -84 H-14Z" fill="#23272b"/>
            <rect x="-15.5" y="-91" width="31" height="6" rx="1" fill="url(#nibGold)"/>
            <rect x="-15" y="-102" width="30" height="2.5" fill="#b8860b" opacity=".85"/>
            <!-- gold nib -->
            <path d="M0 0 C-3 -12 -11 -26 -11 -44 L11 -44 C11 -26 3 -12 0 0Z" fill="url(#nibGold)"/>
            <path d="M0 -3 V-35" stroke="#7a5206" stroke-width="1.1"/>
            <circle cx="0" cy="-37" r="2.6" fill="#7a5206"/>
          </g>
        </g>
      </svg>

      <span class="word w-ar" lang="ar" dir="rtl" style="left:68.75%;top:62.50%;--d:1.30s">العربية</span>
      <span class="word" lang="en" style="left:12.50%;top:54.81%;--d:1.48s">English</span>
      <span class="word" lang="es" style="left:82.29%;top:49.04%;--d:1.66s">Español</span>
      <span class="word" lang="fr" style="left:18.33%;top:72.12%;--d:1.84s">Français</span>
      <span class="word" lang="de" style="left:54.17%;top:86.54%;--d:2.02s">Deutsch</span>
      <span class="word" lang="tr" style="left:31.25%;top:89.42%;--d:2.20s">Türkçe</span>
    </div>

  <p class="not-found-code" aria-hidden="true">404</p>
